name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          SONARR_API_KEY: PRIVATE_SENTINEL_DO_NOT_PUBLISH_72941
      - run: pnpm lint && pnpm typecheck && pnpm format:check && pnpm test
      - name: Gitleaks source and history
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo --config /repo/.gitleaks.toml --redact --no-banner
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner --log-opts=--all
      - run: node scripts/scan.mjs --assets-only
      - run: node scripts/production-smoke.mjs
      - name: Build and run the production container with fictional data
        run: |
          docker build -f deployment/app.Dockerfile -t calendar-app:test .
          docker run -d --name calendar-app --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -e CALENDAR_DEMO=true -p 127.0.0.1:8080:8080 calendar-app:test
          for i in $(seq 1 30); do curl -f http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -f http://127.0.0.1:8080/healthz
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
